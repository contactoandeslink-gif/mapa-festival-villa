<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2200" width="1600" height="2200" style="background-color: #0b130b;">
  <defs>
    <!-- Degradados del Césped Profesional -->
    <linearGradient id="grassStripeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a22"/>
      <stop offset="100%" stop-color="#25591c"/>
    </linearGradient>
    <linearGradient id="grassStripeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#347b27"/>
      <stop offset="100%" stop-color="#2b6720"/>
    </linearGradient>

    <!-- Pista Atlética Olímpica (Terracota de Estadio) -->
    <linearGradient id="trackFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Boulevard Central de Maicillo -->
    <linearGradient id="boulevardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2a677"/>
      <stop offset="50%" stop-color="#dec9a2"/>
      <stop offset="100%" stop-color="#c2a677"/>
    </linearGradient>

    <!-- Tribuna Techada del Estadio -->
    <linearGradient id="grandstandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. BASE EXTERIOR DEL ESTADIO                             -->
  <!-- ======================================================== -->
  <!-- Terreno base oscuro -->
  <rect width="1600" height="2200" fill="#0f1710"/>

  <!-- ======================================================== -->
  <!-- 2. PISTA ATLÉTICA OLÍMPICA DE 400M (VISTA CENITAL 90°)   -->
  <!-- ======================================================== -->
  <!-- Anillo exterior de la pista (Ovalada con rectas laterales) -->
  <g id="pistaAtletica">
    <!-- Base de asfalto terracota -->
    <path d="M 220,680 
             C 220,240 1380,240 1380,680 
             L 1380,1520 
             C 1380,1960 220,1960 220,1520 Z" 
          fill="url(#trackFill)" stroke="#450a0a" stroke-width="6"/>

    <!-- 6 Carriles de la Pista (Líneas blancas vectoriales nítidas) -->
    <path d="M 245,690 C 245,280 1355,280 1355,690 L 1355,1510 C 1355,1920 245,1920 245,1510 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <path d="M 270,700 C 270,320 1330,320 1330,700 L 1330,1500 C 1330,1880 270,1880 270,1500 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <path d="M 295,710 C 295,360 1305,360 1305,710 L 1305,1490 C 1305,1840 295,1840 295,1490 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <path d="M 320,720 C 320,400 1280,400 1280,720 L 1280,1480 C 1280,1800 320,1800 320,1480 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <path d="M 345,730 C 345,440 1255,440 1255,730 L 1255,1470 C 1255,1760 345,1760 345,1470 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
    <!-- Borde interior de la pista que abraza la cancha -->
    <path d="M 370,740 C 370,470 1230,470 1230,740 L 1230,1460 C 1230,1730 370,1730 370,1460 Z" fill="#1e4614" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3. CANCHA DE FÚTBOL OFICIAL (CÉSPED VERDE CON FRANJAS)   -->
  <!-- ======================================================== -->
  <g id="canchaFutbol">
    <!-- Dimensiones oficiales proporcionales: X=390 a 1210 (820px), Y=490 a 1710 (1220px) -->
    <rect x="390" y="490.0" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="577.1" width="820" height="87.6" fill="url(#grassStripeB)"/>
    <rect x="390" y="664.3" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="751.4" width="820" height="87.6" fill="url(#grassStripeB)"/>
    <rect x="390" y="838.6" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="925.7" width="820" height="87.6" fill="url(#grassStripeB)"/>
    <rect x="390" y="1012.9" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="1100.0" width="820" height="87.6" fill="url(#grassStripeB)"/>
    <rect x="390" y="1187.1" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="1274.3" width="820" height="87.6" fill="url(#grassStripeB)"/>
    <rect x="390" y="1361.4" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="1448.6" width="820" height="87.6" fill="url(#grassStripeB)"/>
    <rect x="390" y="1535.7" width="820" height="87.6" fill="url(#grassStripeA)"/>
    <rect x="390" y="1622.9" width="820" height="87.6" fill="url(#grassStripeB)"/>

    <!-- Línea perimetral de cal blanca reglamentaria -->
    <rect x="390" y="490" width="820" height="1220" fill="none" stroke="#ffffff" stroke-width="4"/>

    <!-- Línea de medio campo -->
    <line x1="390" y1="1100" x2="1210" y2="1100" stroke="#ffffff" stroke-width="4"/>

    <!-- Círculo Central -->
    <circle cx="800" cy="1100" r="110" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="800" cy="1100" r="5" fill="#ffffff"/>

    <!-- Área Penal Norte (Lado Escenario) -->
    <rect x="580" y="490" width="440" height="170" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <rect x="670" y="490" width="260" height="65" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="800" cy="600" r="4" fill="#ffffff"/>
    <path d="M 720,660 C 745,690 855,690 880,660" fill="none" stroke="#ffffff" stroke-width="3"/>

    <!-- Área Penal Sur (Lado Acceso) -->
    <rect x="580" y="1540" width="440" height="170" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <rect x="670" y="1645" width="260" height="65" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="800" cy="1600" r="4" fill="#ffffff"/>
    <path d="M 720,1540 C 745,1510 855,1510 880,1540" fill="none" stroke="#ffffff" stroke-width="3"/>

    <!-- Arcos de Tiro de Esquina (Corners) -->
    <path d="M 390,520 A 30,30 0 0,0 420,490" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 1180,490 A 30,30 0 0,0 1210,520" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 390,1680 A 30,30 0 0,1 420,1710" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 1180,1710 A 30,30 0 0,1 1210,1680" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. BOULEVARD CENTRAL PEATONAL (PASILLO DE CIRCULACIÓN)    -->
  <!-- ======================================================== -->
  <g id="boulevardPeatonal">
    <!-- Avenida Central de Maicillo -->
    <rect x="760" y="490" width="80" height="1220" fill="url(#boulevardGrad)" opacity="0.95"/>
    <!-- Línea guía de caminata central punteada -->
    <line x1="800" y1="1680" x2="800" y2="520" stroke="#ffffff" stroke-width="3" stroke-dasharray="14, 12" opacity="0.8"/>
  </g>

  <!-- ======================================================== -->
  <!-- 5. TRIBUNA PRINCIPAL TECHADA (Costado Oriente del Estadio)-->
  <!-- ======================================================== -->
  <g id="tribunaOficial" transform="translate(1410, 720)">
    <!-- Base y escalones de butacas -->
    <rect x="0" y="0" width="130" height="760" rx="10" fill="url(#grandstandGrad)" stroke="#1e293b" stroke-width="3"/>
    <line x1="30" y1="20" x2="30" y2="740" stroke="#94a3b8" stroke-width="2"/>
    <line x1="60" y1="20" x2="60" y2="740" stroke="#94a3b8" stroke-width="2"/>
    <line x1="90" y1="20" x2="90" y2="740" stroke="#94a3b8" stroke-width="2"/>
    <text x="65" y="380" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="900" font-size="13" letter-spacing="3" text-anchor="middle" transform="rotate(90, 65, 380)">TRIBUNA OFICIAL</text>
  </g>

  <!-- ======================================================== -->
  <!-- 6. GRAN ESCENARIO PRINCIPAL (Frente Norte)               -->
  <!-- ======================================================== -->
  <g id="escenarioPrincipal" transform="translate(800, 310)">
    <!-- Tarima Negra de Concierto -->
    <rect x="-240" y="-80" width="480" height="160" rx="12" fill="#030712" stroke="#475569" stroke-width="3.5"/>
    <!-- Estructura de Truss Frontal -->
    <rect x="-220" y="-60" width="440" height="120" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <!-- Pantalla LED Central -->
    <rect x="-140" y="-45" width="280" height="70" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5"/>
    <text x="0" y="-2" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" letter-spacing="3" text-anchor="middle">LIVE SHOW STAGE</text>
    <!-- Cartel distintivo -->
    <g transform="translate(0, 52)">
      <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="5" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">🎸 ESCENARIO PRINCIPAL</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 7. PÓRTICO DE ACCESO SUR (Entrada desde calle Epulef)    -->
  <!-- ======================================================== -->
  <g id="accesoSur" transform="translate(800, 2030)">
    <rect x="-180" y="-35" width="360" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="-160" y="-20" width="140" height="40" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="-90" y="5" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" text-anchor="middle">TORNIQUETE A</text>
    <rect x="20" y="-20" width="140" height="40" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="90" y="5" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" text-anchor="middle">TORNIQUETE B</text>
    <g transform="translate(0, 50)">
      <rect x="-150" y="-16" width="300" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="0" y="5" fill="#fbbf24" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">🎟️ ACCESO PRINCIPAL (ENTRADA)</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 8. BAÑOS / WC (Costado Nor-Poniente)                     -->
  <!-- ======================================================== -->
  <g id="bañosWC" transform="translate(180, 520)">
    <rect x="-60" y="-50" width="120" height="100" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" text-anchor="middle">🚻</text>
    <g transform="translate(0, 65)">
      <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="4" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">BAÑOS / WC</text>
    </g>
  </g>

</svg>