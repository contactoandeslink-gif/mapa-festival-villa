<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000" style="background-color: #070d08;">
  <defs>
    <!-- Filtros de Sombra Arquitectonica -->
    <filter id="dropShadowVenue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="roofShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="14" dy="20" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="stageGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#ef4444" flood-opacity="0.65"/>
    </filter>
    <filter id="lightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="35" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>

    <!-- Degradados del Cesped Profesional -->
    <linearGradient id="grassA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e5318"/>
      <stop offset="50%" stop-color="#276920"/>
      <stop offset="100%" stop-color="#1e5318"/>
    </linearGradient>
    <linearGradient id="grassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a7322"/>
      <stop offset="50%" stop-color="#328a29"/>
      <stop offset="100%" stop-color="#2a7322"/>
    </linearGradient>

    <!-- Pista Atletica Olimpica (Terracota de Estadio) -->
    <linearGradient id="tartanTrack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="80%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#701a1a"/>
    </linearGradient>

    <!-- Techo de la Tribuna Oficial -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Asfalto Perimetral y Explanada -->
    <radialGradient id="apronRadial" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="65%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>

    <!-- Boulevard de Maicillo Central -->
    <linearGradient id="sandWalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b89764"/>
      <stop offset="50%" stop-color="#d8bf93"/>
      <stop offset="100%" stop-color="#b89764"/>
    </linearGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- FONDO LIMPIO: RECINTO AISLADO (BORRA TODO SOLO LA CANCHA) -->
  <!-- ======================================================== -->
  <rect width="2000" height="2000" fill="#080e09"/>

  <!-- Resplandor sutil de las 4 Torres de Iluminacion del Estadio -->
  <circle cx="480" cy="480" r="200" fill="#38bdf8" opacity="0.06" filter="url(#lightGlow)"/>
  <circle cx="1520" cy="480" r="200" fill="#38bdf8" opacity="0.06" filter="url(#lightGlow)"/>
  <circle cx="480" cy="1520" r="200" fill="#38bdf8" opacity="0.06" filter="url(#lightGlow)"/>
  <circle cx="1520" cy="1520" r="200" fill="#38bdf8" opacity="0.06" filter="url(#lightGlow)"/>

  <!-- ======================================================== -->
  <!-- GRUPO PRINCIPAL: ESTADIO MUNICIPAL MATIAS VIDAL PEREZ    -->
  <!-- Orientado exactamente segun Google Maps (-42.5 grados)   -->
  <!-- Centro geometrico en X=1000, Y=1000                      -->
  <!-- ======================================================== -->
  <g id="estadioVillarricaVenue" transform="translate(1000, 1000) rotate(-42.5)" filter="url(#dropShadowVenue)">

    <!-- 1. Explanada Perimetral de Pavimento / Circulacion -->
    <rect x="-460" y="-680" width="920" height="1360" rx="140" fill="url(#apronRadial)" stroke="#374151" stroke-width="4"/>
    <rect x="-450" y="-670" width="900" height="1340" rx="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="12, 10"/>

    <!-- 2. PISTA ATLETICA DE 400M (OVALADA CON 6 CARRILES) -->
    <g id="pistaAtletica">
      <!-- Base de Tartan Rojo -->
      <path d="M -360,-380 
               C -360,-650 360,-650 360,-380 
               L 360,380 
               C 360,650 -360,650 -360,380 Z" 
            fill="url(#tartanTrack)" stroke="#450a0a" stroke-width="5"/>

      <!-- Carriles Reglamentarios (Lineas blancas vectoriales nitidas) -->
      <path d="M -345,-380 C -345,-630 345,-630 345,-380 L 345,380 C 345,630 -345,630 -345,380 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8"/>
      <path d="M -330,-380 C -330,-610 330,-610 330,-380 L 330,380 C 330,610 -330,610 -330,380 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8"/>
      <path d="M -315,-380 C -315,-590 315,-590 315,-380 L 315,380 C 315,590 -315,590 -315,380 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8"/>
      <path d="M -300,-380 C -300,-570 300,-570 300,-380 L 300,380 C 300,570 -300,570 -300,380 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8"/>
      <path d="M -285,-380 C -285,-550 285,-550 285,-380 L 285,380 C 285,550 -285,550 -285,380 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.8"/>

      <!-- Borde Interior Blanco que rodea el cesped -->
      <path d="M -270,-380 C -270,-530 270,-530 270,-380 L 270,380 C 270,530 -270,530 -270,380 Z" fill="#143d10" stroke="#ffffff" stroke-width="3.5"/>
    </g>

    <!-- 3. CANCHA DE FUTBOL PROFESIONAL (CESPED NATURAL) -->
    <!-- Proporcion oficial: Ancho=540px (-270 a 270), Largo=820px (-410 a 410) -->
    <g id="canchaFutbol">
      <!-- Franjas de corte de cesped alternadas (10 franjas de 82px) -->
      <rect x="-270" y="-410" width="540" height="82" fill="url(#grassA)"/>
      <rect x="-270" y="-328" width="540" height="82" fill="url(#grassB)"/>
      <rect x="-270" y="-246" width="540" height="82" fill="url(#grassA)"/>
      <rect x="-270" y="-164" width="540" height="82" fill="url(#grassB)"/>
      <rect x="-270" y="-82"  width="540" height="82" fill="url(#grassA)"/>
      <rect x="-270" y="0"    width="540" height="82" fill="url(#grassB)"/>
      <rect x="-270" y="82"   width="540" height="82" fill="url(#grassA)"/>
      <rect x="-270" y="164"  width="540" height="82" fill="url(#grassB)"/>
      <rect x="-270" y="246"  width="540" height="82" fill="url(#grassA)"/>
      <rect x="-270" y="328"  width="540" height="82" fill="url(#grassB)"/>

      <!-- Linea perimetral de cal blanca reglamentaria -->
      <rect x="-270" y="-410" width="540" height="820" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="miter"/>

      <!-- Linea de medio campo -->
      <line x1="-270" y1="0" x2="270" y2="0" stroke="#ffffff" stroke-width="3.5"/>

      <!-- Circulo Central Oficial (Radio proporcional = 74px) -->
      <circle cx="0" cy="0" r="74" fill="none" stroke="#ffffff" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>

      <!-- Area Penal Norte (Sector Escenario / Red Circle) -->
      <rect x="-160" y="-410" width="320" height="125" fill="none" stroke="#ffffff" stroke-width="3.5"/>
      <rect x="-80"  y="-410" width="160" height="45" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="-325" r="4" fill="#ffffff"/>
      <path d="M -50,-285 C -30,-260 30,-260 50,-285" fill="none" stroke="#ffffff" stroke-width="3"/>
      <!-- Arco Norte con red -->
      <rect x="-38" y="-424" width="76" height="14" fill="none" stroke="#ffffff" stroke-width="3"/>
      <line x1="-38" y1="-417" x2="38" y2="-417" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>

      <!-- Area Penal Sur (Sector Acceso Epulef) -->
      <rect x="-160" y="285" width="320" height="125" fill="none" stroke="#ffffff" stroke-width="3.5"/>
      <rect x="-80"  y="365" width="160" height="45" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="325" r="4" fill="#ffffff"/>
      <path d="M -50,285 C -30,260 30,260 50,285" fill="none" stroke="#ffffff" stroke-width="3"/>
      <!-- Arco Sur con red -->
      <rect x="-38" y="410" width="76" height="14" fill="none" stroke="#ffffff" stroke-width="3"/>
      <line x1="-38" y1="417" x2="38" y2="417" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>

      <!-- Arcos de Tiro de Esquina (Corners) -->
      <path d="M -270,-390 A 20,20 0 0,0 -250,-410" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M 250,-410 A 20,20 0 0,0 270,-390" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M -270,390 A 20,20 0 0,1 -250,410" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M 250,410 A 20,20 0 0,1 270,390" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- 4. PASILLO CENTRAL PEATONAL (MAICILLO DEL FESTIVAL) -->
    <g id="boulevardCentral">
      <rect x="-40" y="-380" width="80" height="760" rx="10" fill="url(#sandWalk)" opacity="0.9" stroke="#a1824a" stroke-width="2"/>
      <line x1="0" y1="-360" x2="0" y2="360" stroke="#ffffff" stroke-width="3" stroke-dasharray="14, 12" opacity="0.85"/>
    </g>

    <!-- 5. TRIBUNA OFICIAL TECHADA (COSTADO ORIENTE DE LA CANCHA) -->
    <!-- Coincide con la tribuna techada visible en Google Maps al sureste -->
    <g id="tribunaTechada" transform="translate(380, -220)" filter="url(#roofShadow)">
      <!-- Sombra proyectada del techo -->
      <rect x="10" y="10" width="110" height="440" rx="14" fill="rgba(0,0,0,0.5)"/>
      <!-- Graderias y Asientos Azules -->
      <rect x="0" y="0" width="100" height="440" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
      <line x1="25" y1="10" x2="25" y2="430" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6, 4"/>
      <line x1="50" y1="10" x2="50" y2="430" stroke="#2563eb" stroke-width="3" stroke-dasharray="6, 4"/>
      <line x1="75" y1="10" x2="75" y2="430" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6, 4"/>
      <!-- Cubierta / Techo Arquitectonico Cantilever Blanco -->
      <rect x="-10" y="-10" width="115" height="460" rx="12" fill="url(#roofGrad)" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Nervaduras del techo -->
      <line x1="-10" y1="70"  x2="105" y2="70"  stroke="#64748b" stroke-width="2"/>
      <line x1="-10" y1="150" x2="105" y2="150" stroke="#64748b" stroke-width="2"/>
      <line x1="-10" y1="230" x2="105" y2="230" stroke="#64748b" stroke-width="2"/>
      <line x1="-10" y1="310" x2="105" y2="310" stroke="#64748b" stroke-width="2"/>
      <line x1="-10" y1="390" x2="105" y2="390" stroke="#64748b" stroke-width="2"/>
      <text x="48" y="225" fill="#0f172a" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" letter-spacing="3" text-anchor="middle" transform="rotate(90, 48, 225)">TRIBUNA OFICIAL</text>
    </g>

    <!-- 6. GRAN ESCENARIO PRINCIPAL (FRENTE NORTE - CIRCULO ROJO DEL USUARIO) -->
    <g id="escenarioNorte" transform="translate(0, -490)" filter="url(#stageGlow)">
      <!-- Tarima Negra de Alta Resistencia -->
      <rect x="-180" y="-65" width="360" height="130" rx="10" fill="#0a0f1d" stroke="#475569" stroke-width="3"/>
      <!-- Estructura de Truss Frontal y Torres de Audio Line Array -->
      <rect x="-165" y="-50" width="330" height="100" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
      <!-- Pantalla LED Gigante Central -->
      <rect x="-110" y="-38" width="220" height="65" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
      <text x="0" y="-2" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-weight="900" font-size="13" letter-spacing="2" text-anchor="middle">LIVE SHOW STAGE</text>
      <!-- Cartel Identificador -->
      <g transform="translate(0, 45)">
        <rect x="-115" y="-12" width="230" height="24" rx="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
        <text x="0" y="4" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" letter-spacing="1" text-anchor="middle">🎸 ESCENARIO PRINCIPAL</text>
      </g>
    </g>

    <!-- 7. PORTICO DE ACCESO SUR (CALLE SATURNINO EPULEF - CIRCULO AZUL INFERIOR) -->
    <g id="accesoSur" transform="translate(0, 560)">
      <rect x="-150" y="-30" width="300" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
      <rect x="-130" y="-16" width="115" height="32" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <text x="-72" y="5" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">TORNIQUETE A</text>
      <rect x="15" y="-16" width="115" height="32" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <text x="72" y="5" fill="#34d399" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">TORNIQUETE B</text>
      <!-- Cartel Acceso -->
      <g transform="translate(0, 42)">
        <rect x="-130" y="-13" width="260" height="26" rx="13" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
        <text x="0" y="4" fill="#fbbf24" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" letter-spacing="1" text-anchor="middle">🎟️ ACCESO PRINCIPAL (EPULEF)</text>
      </g>
    </g>

    <!-- 8. BANOS / WC Y ACCESO NOR-PONIENTE (CIRCULO AZUL SUPERIOR DEL USUARIO) -->
    <g id="serviciosPoniente" transform="translate(-390, -320)">
      <rect x="-55" y="-45" width="110" height="90" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
      <text x="0" y="8" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" text-anchor="middle">🚻</text>
      <g transform="translate(0, 58)">
        <rect x="-50" y="-11" width="100" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">BAÑOS / WC</text>
      </g>
    </g>

    <!-- 9. TORRES DE ILUMINACION PROFESIONAL (4 ESQUINAS DEL ESTADIO) -->
    <g id="torresLuz">
      <circle cx="-420" cy="-560" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
      <circle cx="-420" cy="-560" r="8" fill="#38bdf8"/>
      <circle cx="420" cy="-560" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
      <circle cx="420" cy="-560" r="8" fill="#38bdf8"/>
      <circle cx="-420" cy="560" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
      <circle cx="-420" cy="560" r="8" fill="#38bdf8"/>
      <circle cx="420" cy="560" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
      <circle cx="420" cy="560" r="8" fill="#38bdf8"/>
    </g>

  </g>
</svg>
